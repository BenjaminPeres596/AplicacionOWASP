# === LIMITES Y RATE LIMITING ===
limit_conn_zone $binary_remote_addr zone=addr:10m;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m     rate=100r/s;
limit_req_zone $binary_remote_addr zone=general:10m rate=50r/s;

server {
  listen 80;
  server_name _;

  # No mostrar versión exacta de nginx (pero sí mantener header Server para que lo vea el scanner)
  server_tokens off;

  # Limitar tamaño del cuerpo de la solicitud (prevenir DoS grandes)
  client_max_body_size       10M;
  client_body_buffer_size    128k;

  # Timeouts más permisivos para pruebas
  client_header_timeout 30s;
  client_body_timeout   30s;
  send_timeout          30s;

  # Limitar conexiones por IP (suficientemente alto para pruebas)
  limit_conn addr 50;

  # Rate limiting general por defecto
  limit_req zone=general burst=50 nodelay;

  # Ocultar headers sensibles del backend
  proxy_hide_header X-Powered-By;
  proxy_hide_header Server;

  # ===========================
  #   HEADERS DE SEGURIDAD
  # ===========================

  # --- Aislamiento y anti-Spectre ---
  add_header Cross-Origin-Opener-Policy  "same-origin"    always;
  add_header Cross-Origin-Embedder-Policy "require-corp"  always;
  add_header Cross-Origin-Resource-Policy "same-origin"   always;

  # --- Política de permisos muy restrictiva ---
  add_header Permissions-Policy "
    geolocation=(),
    microphone=(),
    camera=(),
    payment=(),
    usb=(),
    accelerometer=(),
    gyroscope=(),
    magnetometer=(),
    fullscreen=(),
    picture-in-picture=()
  " always;

  # --- Cabeceras básicas de seguridad ---
  add_header X-Content-Type-Options "nosniff"             always;
  add_header X-Frame-Options        "DENY"                always;
  add_header Referrer-Policy        "no-referrer"         always;
  add_header X-XSS-Protection       "1; mode=block"       always;

  # HSTS (para scanners); en producción SOLO sobre HTTPS
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

  # CSP lo más restrictiva posible sin matar completamente la app
  # (IMPORTANTE: un solo header en una sola línea)
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;

  # Otros headers de seguridad (muchos scanners los miran)
  add_header X-Permitted-Cross-Domain-Policies "none"      always;
  add_header X-Download-Options                "noopen"    always;
  add_header Expect-CT                         "max-age=86400, enforce" always;

  # Cache por defecto: no-cache para HTML/API (lo sobreescribimos en estáticos)
  add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  add_header Pragma        "no-cache"                            always;

  # Opción: header X-Powered-By personalizado para que tu script lo vea presente
  # (Si querés que se vea AUSENTE, comentá esta línea y dejá solo el proxy_hide_header)
  add_header X-Powered-By "secure-stack" always;

  # ===========================
  #   BLOQUEO DE RECURSOS SENSIBLES
  # ===========================
  location ~* \.(htaccess|htpasswd|ini|log|sh|sql|conf)$ {
    deny all;
    return 404;
  }

  location ~ /\. {
    deny all;
    return 404;
  }

  # ===========================
  #   ESTÁTICOS (más permisivos)
  # ===========================
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    # Para estáticos sí queremos caching
    add_header Cache-Control "public, max-age=3600" always;
    # Mantener nosniff también en estáticos
    add_header X-Content-Type-Options "nosniff" always;

    # Rate limiting muy suave para no romper pruebas masivas
    limit_req zone=general burst=200 nodelay;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://juice-shop:3000;
  }

  # ===========================
  #   API
  # ===========================
  location /api/ {
    # Sigue teniendo un rate limit más estricto que lo general, pero cómodo para testear
    limit_req zone=api burst=60 nodelay;

    # API sin cache
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma        "no-cache"                            always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://juice-shop:3000;
  }

  # ===========================
  #   LOGIN / AUTH
  # ===========================
location ~* /(login|signin|auth|register) {
    limit_req zone=login burst=2 nodelay;
    limit_req_status 429;

    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma        "no-cache"                            always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://juice-shop:3000;
  }

  # ===========================
  #   HTML / SPA (rutas generales)
  # ===========================
  location / {
    # Rate limit moderado para scans + pruebas de carga razonables
    limit_req zone=general burst=100 nodelay;

    # Ya tenemos Cache-Control y Pragma por defecto arriba

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 30s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    proxy_pass http://juice-shop:3000;
  }
}
