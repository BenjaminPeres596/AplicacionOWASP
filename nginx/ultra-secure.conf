# Configuración de límites de rate y conexiones (debe ir fuera del bloque server)
limit_conn_zone $binary_remote_addr zone=addr:10m;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

server {
  listen 80;
  server_name _;

  # No filtrar versión de Nginx
  server_tokens off;

  # Limitar tamaño del cuerpo de la solicitud (prevenir DoS)
  client_max_body_size 10M;
  client_body_buffer_size 128k;
  
  # Timeouts más permisivos para funcionalidad
  client_header_timeout 30s;
  client_body_timeout 30s;
  send_timeout 30s;

  # Limitar conexiones por IP (más permisivo)
  limit_conn addr 20;

  # Esconder headers del backend para no revelar tecnología
  proxy_hide_header X-Powered-By;
  proxy_hide_header Server;

  # Seguridad de contexto de proceso/navegación para mitigar ataques de Spectre
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  # Seguridad de carga de recursos para mitigar ataques de Spectre
  add_header Cross-Origin-Embedder-Policy "require-corp" always;

  # Política de permisos básica para mitigar ataques de Spectre
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

  # Aislar recursos entre orígenes para mitigar ataques de Spectre
  add_header Cross-Origin-Resource-Policy "same-origin" always;

  # Headers de seguridad equilibrados
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-XSS-Protection "1; mode=block" always;

  # Content Security Policy (CSP) equilibrada para seguridad y funcionalidad
  add_header Content-Security-Policy "
    default-src 'self';
    script-src 'self' 'unsafe-inline' 'unsafe-eval';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: https:;
    font-src 'self' data:;
    connect-src 'self';
    frame-ancestors 'none';
    object-src 'none';
    base-uri 'self';
    form-action 'self';
  " always;

  # Bloquear acceso a archivos sensibles comunes
  location ~* \.(htaccess|htpasswd|ini|log|sh|sql|conf)$ {
    deny all;
    return 404;
  }

  # Bloquear acceso a directorios ocultos
  location ~ /\. {
    deny all;
    return 404;
  }

  # Estáticos: cacheables
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
    
    # Rate limiting moderado para archivos estáticos
    limit_req zone=api burst=50 nodelay;
    
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://juice-shop:3000;
  }

  # API endpoints con rate limiting moderado
  location /api/ {
    limit_req zone=api burst=10 nodelay;
    
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://juice-shop:3000;
  }

  # Login endpoints con rate limiting
  location ~* /(login|signin|auth|register) {
    limit_req zone=login burst=5 nodelay;
    
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://juice-shop:3000;
  }

  # HTML y rutas SPA: seguridad equilibrada
  location / {
    # Rate limiting general moderado
    limit_req zone=api burst=20 nodelay;
    
    # Headers de seguridad básicos
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Timeouts moderados para proxy
    proxy_connect_timeout 30s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    
    proxy_pass http://juice-shop:3000;
  }
}
