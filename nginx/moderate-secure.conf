# Configuración de límites más permisivos
limit_conn_zone $binary_remote_addr zone=addr:10m;
limit_req_zone $binary_remote_addr zone=login:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;

server {
  listen 80;
  server_name _;

  # No filtrar versión de Nginx
  server_tokens off;

  # Limitar tamaño del cuerpo de la solicitud
  client_max_body_size 50M;
  client_body_buffer_size 256k;
  
  # Timeouts moderados
  client_header_timeout 60s;
  client_body_timeout 60s;
  send_timeout 60s;

  # Limitar conexiones por IP (más permisivo)
  limit_conn addr 50;

  # Esconder algunos headers del backend
  proxy_hide_header X-Powered-By;

  # Headers de seguridad básicos
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Content Security Policy permisiva
  add_header Content-Security-Policy "
    default-src 'self' 'unsafe-inline' 'unsafe-eval';
    script-src 'self' 'unsafe-inline' 'unsafe-eval' https:;
    style-src 'self' 'unsafe-inline' https:;
    img-src 'self' data: https:;
    font-src 'self' data: https:;
    connect-src 'self' https:;
  " always;

  # Estáticos: cacheables
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    add_header Cache-Control "public, max-age=3600" always;
    
    # Rate limiting más permisivo
    limit_req zone=api burst=100 nodelay;
    
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://juice-shop:3000;
  }

  # API endpoints con rate limiting moderado
  location /api/ {
    limit_req zone=api burst=20 nodelay;
    
    add_header Cache-Control "no-cache" always;
    
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://juice-shop:3000;
  }

  # Login endpoints con rate limiting suave
  location ~* /(login|signin|auth|register) {
    limit_req zone=login burst=10 nodelay;
    
    add_header Cache-Control "no-cache" always;
    
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://juice-shop:3000;
  }

  # HTML y rutas SPA
  location / {
    # Rate limiting general suave
    limit_req zone=api burst=50 nodelay;
    
    # Headers básicos
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Timeouts generosos
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    proxy_pass http://juice-shop:3000;
  }
}