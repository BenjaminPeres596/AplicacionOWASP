services:
  juice-shop:
    image: bkimminich/juice-shop
    container_name: juice-shop
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  # Servidor Ultra-Seguro (máximo endurecimiento)
  ultra-secure-proxy:
    image: nginx:alpine
    container_name: ultra-secure-proxy
    depends_on:
      - juice-shop
    ports:
      - "8080:80"
    volumes:
      - ./nginx/ultra-secure.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  # Servidor Moderadamente Seguro (nivel intermedio)
  moderate-secure-proxy:
    image: nginx:alpine
    container_name: moderate-secure-proxy
    depends_on:
      - juice-shop
    ports:
      - "8081:80"
    volumes:
      - ./nginx/moderate-secure.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  # Servidor Básico (seguridad mínima)
  basic-proxy:
    image: nginx:alpine
    container_name: basic-proxy
    depends_on:
      - juice-shop
    ports:
      - "8082:80"
    volumes:
      - ./nginx/basic.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  zap:
    image: zaproxy/zap-stable
    container_name: zap
    entrypoint: "" # necesario para poder pasarle comandos a zap-baseline.py
    volumes:
      - ./reports:/zap/wrk
